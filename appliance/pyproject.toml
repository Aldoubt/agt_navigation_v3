[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agt-yhs-field-appliance"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["PyYAML==6.0.3"]

[project.scripts]
agt-field = "agt_field.cli:main"
agt-field-runtime = "agt_field.server:main"

[tool.setuptools]
packages = ["agt_field"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
