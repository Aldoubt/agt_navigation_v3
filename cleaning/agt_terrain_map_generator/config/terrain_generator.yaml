agt_terrain_map_generator:
  ros__parameters:
    # Keep disabled until PatchSetSource + elevation/slope/obstacle builders
    # have passed the offline A/B acceptance suite against agt_map_converter.
    pipeline:
      enabled: false

    source:
      # Preferred source for sensor/body-local ground segmentation.
      # Expected map directory contains poses.txt and patches/*.pcd.
      type: patch_set
      map_directory: ""
      global_map_pcd: ""
      poses_txt: ""
      patches_directory: ""

    output_root: ~/.ros/agt_maps/latest

    # Terrain/navigation map cleaning only; never alters FAST-LIO, localization
    # input, or the localization global_map.pcd.
    map_cleaning:
      enabled: true
      # v0.3.2 first phase: evidence only. No terrain point is removed by this
      # analysis and no result is consumed by traversability in this release.
      voxel_persistence:
        enabled: true
        resolution_m: 0.10
        min_observation: 3
      static_confidence:
        enabled: true
        voxel_scales:
          fine: 0.10
          structure: 0.25
          scene: 0.50
        weights:
          temporal: 0.30
          fine: 0.25
          structure: 0.25
          scene: 0.10
          ground: 0.10
        thresholds:
          high: 0.8
          medium: 0.5

    robot_mesh_filter:
      enabled: true
      robot_frame: base_link
      # The tracked chassis runtime URDF publishes lidar_link. Supply a
      # rendered URDF; xacro expansion is performed by caller/bringup.
      lidar_frame: lidar_link
      urdf_path: ""

    # TerrainPreprocessor runs after patch gravity alignment.  Geometric
    # decisions are evaluated in body coordinates, while retained points stay
    # in the gravity-level frame used by Patchwork++.
    robot_geometry:
      body_box:
        center_xyz: [0.0, 0.0, 0.20]
        size_xyz: [1.023, 0.778, 0.400]
        padding_m: 0.05

    self_filter:
      enabled: true

    # Conservative by default: only enable this for the offline terrain map
    # experiment after comparing against the baseline map.  This has no path
    # into FAST-LIO or localization.
    rear_filter:
      enabled: false
      box:
        x_min: -2.0
        x_max: 0.0
        y_min: -0.8
        y_max: 0.8
        z_min: -0.5
        z_max: 2.0

    voxel:
      enabled: true
      leaf_size_m: 0.20

    ground_segmenter:
      type: patchworkpp
      patchworkpp:
        # REQUIRED CALIBRATION. This is the height of the BODY-FRAME PATCH
        # ORIGIN above local ground, not a guessed MID360 mounting value.
        # A value <= 0 keeps production activation invalid until measured.
        sensor_height_m: 0.0
        min_range_m: 1.0
        max_range_m: 80.0
        verbose: false

        # Mapping patches currently expose XYZ, not trustworthy intensity.
        # Patchwork++ RNR is intensity-dependent and therefore stays disabled.
        enable_rnr: false
        enable_rvpf: true
        enable_tgr: true

    grid:
      resolution_m: 0.05
      # Builders must process large outdoor maps in bounded chunks rather than
      # assuming one full-resolution dense grid always fits in memory.
      tile_size_cells: 512

    elevation:
      # Robust ground statistic; replaces the fallback converter's min_z surface.
      method: median
      min_points_per_cell: 3
      max_variance_m2: 0.04

    obstacle:
      # Height is evaluated relative to the estimated local ground surface.
      min_height_m: 0.25
      max_height_m: 3.0

    slope:
      # Legacy 2D-map threshold; v0.3 traversability uses the three bands
      # below so tracked robots are not blocked at 20 degrees by default.
      max_angle_deg: 20.0
      safe_degree: 10.0
      warning_degree: 20.0
      blocked_degree: 30.0

    trajectory:
      enabled: true
      robot_radius_m: 0.45
      inflation_m: 0.20

    traversability:
      slope_weight: 0.35
      obstacle_weight: 0.35
      roughness_weight: 0.15
      confidence_weight: 0.15
      trajectory_bonus: 0.10
      obstacle_ignore_height_m: 0.15
      obstacle_blocked_height_m: 0.50
      roughness_variance_m2: 0.04
      min_confidence: 0.50

    unknown:
      # Low-confidence cells stay unknown instead of being promoted to free.
      min_confidence: 0.5

    output:
      save_elevation: true
      save_slope: true
      save_obstacle: true
      save_confidence: true
