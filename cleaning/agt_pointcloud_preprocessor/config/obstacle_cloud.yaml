agt_obstacle_cloud_preprocessor:
  ros__parameters:
    # Navigation/local-perception branch only. FAST-LIO2 must keep its original
    # time-preserving MID360 input path (usually Livox CustomMsg).
    # agt_livox_tools normalizes either driver representation to PointCloud2 here.
    input_topic: /agt/livox/points
    output_topic: /agt/navigation/points_obstacles
    base_frame: base_link

    # Empty accepts the actual source frame and relies on TF base_link <- cloud_frame.
    expected_input_frame: ""
    tf_timeout_sec: 0.05
    drop_on_tf_failure: true

    range:
      min_m: 0.5
      max_m: 120.0

    self_filter:
      enabled: true
      center_xyz: [0.0, 0.0, 0.20]
      size_xyz: [1.023, 0.778, 0.400]
      padding_m: 0.05

    # Formal rear exclusion contract.  The node implements only rear_sector.*;
    # do not use the retired rear_filter box key (it was never consumed).
    # This navigation-only filter must remain disabled by default.  Enable it
    # only for a recorded self-obstacle experiment after reviewing the output.
    rear_sector:
      enabled: false
      center_deg: 180.0
      width_deg: 10.0
      min_range_m: 0.5
      max_range_m: 4.0

    voxel:
      enabled: true
      leaf_size_m: 0.20

    # Cumulative, read-only experiment observability.  With a non-empty path,
    # final YAML statistics are written at a clean node shutdown.  A positive
    # interval prints the same key ratios periodically; defaults preserve the
    # normal field runtime's quiet behavior.
    statistics_output: ""
    debug_log_interval_sec: 0.0
