agt_batch_lio_adapter:
  ros__parameters:
    input_topic: /aft_mapped_to_init
    output_topic: /agt/odometry/local
    source_parent_frame: camera_init
    source_child_frame: body
    output_parent_frame: odom
    output_child_frame: base_link
    # Odometry messages describe base_link. TF rotates about the ground-plane
    # frame so the tree is odom -> base_footprint -> base_link.
    tf_child_frame: base_footprint

    # Physical mount source of truth:
    # agt_robot_description publishes base_link -> livox_frame.
    # Internal LiDAR/IMU source of truth:
    # the exact Batch-LIO runtime YAML passed through batch_lio_config_file.
    lidar_frame: livox_frame
    batch_lio_config_file: ""
    max_input_age_sec: 0.20
    tf_timeout_sec: 0.20
    # Diagnostics only: these do not alter odometry or TF publication.
    adapter_status_topic: /agt/odometry/adapter_status
    diagnostic_publish_rate_hz: 5.0
    stale_pose_timeout_sec: 1.0
    publish_rate_window_sec: 1.0

    # Normal field mode derives T_body_base from the two sources above.
    # Legacy override remains available only for controlled recovery/debugging;
    # values must be supplied explicitly when enabled.
    use_configured_extrinsic: false
    body_to_base_translation: []
    body_to_base_quaternion_xyzw: []

    allow_parent_alias: false
    # Functionhx/Batch-LIO publishes zero twist on /aft_mapped_to_init. Nav2 RPP
    # uses odometry twist for rotate-to-heading acceleration limiting, so derive
    # a real base_link-frame twist from consecutive adapted poses.
    derive_twist_from_pose: true
    twist_min_dt_sec: 0.01
    twist_max_dt_sec: 0.50
    twist_linear_deadband_mps: 0.01
    twist_angular_deadband_rps: 0.01
    twist_max_linear_mps: 2.0
    twist_max_angular_rps: 3.0
    debug_path_topic: /agt/debug/local_path
