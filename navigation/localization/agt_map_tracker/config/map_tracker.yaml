agt_map_tracker:
  ros__parameters:
    scan_topic: /agt/livox/points
    local_odom_topic: /agt/odometry/local
    localization_status_topic: /agt/localization/status
    output_pose_topic: /agt/map_tracking/pose
    status_topic: /agt/map_tracking/status
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    global_map: ''
    tracking_rate_hz: 0.5
    backend_threads: 2
    local_map_radius_xy_m: 20.0
    local_map_half_height_m: 5.0
    query_accumulate_clouds: 3
    query_voxel_leaf_m: 0.25
    max_points: 150000
    min_query_points: 1500
    min_local_map_points: 1000
    max_fitness: 0.50
    min_overlap: 0.40
    max_translation_innovation_m: 0.50
    max_yaw_innovation_deg: 5.0
    odom_match_max_skew_sec: 0.10
    tf_timeout_sec: 0.10
    native_timeout_sec: 8.0

    # Failure hysteresis: one bad registration holds the current map->odom.
    # Repeated failures degrade the tracker and eventually request recovery.
    degraded_after_rejects: 2
    recovery_after_rejects: 4

    # Hessian observability is recorded during the first offline tuning pass.
    # Keep rejection disabled until replay distributions define a field-safe
    # threshold; enabling it turns severe geometry degeneracy into HOLD/RECOVERY.
    reject_degenerate_hessian: false
    max_hessian_condition_number: 1.0e10
    apply_correction: true
    save_debug_cloud: false
    debug_directory: ~/.ros/agt_map_tracker_debug
    max_debug_failure_samples: 20

    # Shadow mode uses timestamp-bracketed per-point deskew, an asynchronous
    # matcher and isolated pose/status publishers. It cannot apply correction.
    shadow_mode: false
    quality_calibrated: false
    quality_topic: /agt/localization/global_observation
    odom_quality_topic: /agt/odometry/quality
    map_id: ''
    map_version: ''
    map_hash: ''
    max_result_age_sec: 2.0
    deskew_max_odom_gap_sec: 0.05
    max_point_offset_sec: 0.20
    max_normalized_hessian_condition: 1.0e10
