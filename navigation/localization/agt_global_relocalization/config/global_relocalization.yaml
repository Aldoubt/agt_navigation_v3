agt_global_relocalization:
  ros__parameters:
    # Live default from agt_livox_tools. Offline replay launch overrides this
    # with /agt/relocalization/input_cloud to keep recorded-query tests isolated.
    scan_topic: /agt/livox/points
    request_topic: /agt/relocalization/request
    output_pose_topic: /agt/relocalization/pose
    status_topic: /agt/global_relocalization/status
    map_frame: map

    # Follow the validated active Map Package by default. global_map and
    # relocalization_assets below remain manual fallback paths for bench tests.
    follow_map_manager: true
    map_status_topic: /agt/map/status

    # Compatibility-only timestamped TF target for relocalization_query_frame_mode=base_link.
    query_frame: base_link
    # Formal PGO map contract: global_map.pcd and formal poses are built from
    # body-frame clouds (T_map_body). mapping_body applies mapping-era
    # T_body_livox and native refinement yields T_map_body, which is converted
    # exactly once to T_map_base before publication. base_link remains a
    # deprecated compatibility mode. body_aligned remains a deprecated alias.
    # Candidate BBS shares the formal mapping_body contract.  Its native
    # coarse/refined result is T_map_body and the wrapper converts it exactly
    # once to T_map_base before publishing.  base_link is deprecated
    # compatibility only and must be selected explicitly for both parameters.
    relocalization_query_frame_mode: mapping_body
    mapping_body_livox_translation: [-0.011, -0.02329, 0.04412]
    mapping_body_livox_quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]
    body_to_base_translation: [-0.16403417, 0.02439982, -0.49511119]
    body_to_base_quaternion_xyzw: [0.000477000, -0.100267018, -0.001592000, 0.994959177]
    bbs_query_frame_mode: mapping_body
    tf_timeout_sec: 0.10
    require_stationary: true
    local_odom_topic: /agt/odometry/local
    odom_freshness_sec: 0.50
    stationary_linear_threshold_mps: 0.05
    stationary_angular_threshold_rps: 0.08

    # V1 default backend: true no-initial-pose CPU 3D-BBS coarse search followed
    # by small_gicp GICP refinement. RTK/INS is deliberately NOT an input here.
    # Generate relocalization_assets once for each final optimized PCD. If assets are
    # left empty, the backend still works but rebuilds the BBS hierarchy at runtime.
    # Parameter sweeps call the native backend directly; keep this production command
    # stable until replay testing selects a field baseline.
    # Preferred V1 CPU backend when the active Map Package contains polar_context.db.
    # The descriptor supplies the dominant yaw; BBS searches translation only and
    # small_gicp absorbs descriptor quantization plus the remaining 6-DoF residual.
    candidate_sdk_command: >-
      ros2 run agt_global_relocalization_native candidate_bbs_gicp_localizer
      --map {global_map} --scan {scan_pcd} {assets_arg}
      --timeout {timeout_sec}
      --candidate-top-k 2 --descriptor-prefilter 40
      --candidate-xy-radius 4.0 --candidate-z-radius 2.0
      --candidate-yaw-range-deg 0.0 --roll-pitch-range-deg 0.0
      --bbs-query-frame-mode {bbs_query_frame_mode}
      --base-from-body-tx 0.25960014 --base-from-body-ty -0.02326770 --base-from-body-tz 0.45244230
      --base-from-body-qx -0.000477000 --base-from-body-qy 0.100267018
      --base-from-body-qz 0.001592000 --base-from-body-qw 0.994959177
      --per-candidate-timeout 8.0 --bbs-score-threshold 0.05
      --local-map-radius-xy {local_map_radius_xy}
      --local-map-half-height {local_map_half_height}
      --min-local-map-points {min_local_map_points}

    # Compatibility fallback for old map packages without polar_context.db.
    sdk_command: >-
      ros2 run agt_global_relocalization_native bbs_gicp_localizer
      --map {global_map} --scan {scan_pcd} {assets_arg}
      --timeout {timeout_sec}
      --local-map-radius-xy {local_map_radius_xy}
      --local-map-half-height {local_map_half_height}
      --min-local-map-points {min_local_map_points}
    global_map: ""
    relocalization_assets: ""
    backend_local_map_radius_xy: 35.0
    backend_local_map_half_height: 8.0
    backend_min_local_map_points: 800
    work_dir: ~/.ros/agt_global_relocalization
    sdk_timeout_sec: 18.0

    # Accumulate several navigation-only PointCloud2 frames. Batch-LIO continues
    # to consume the untouched timing-preserving Livox CustomMsg stream.
    accumulate_clouds: 5
    # Keep online query geometry consistent with the FAST-LIO2 map source:
    # remove no-return/near-field points, reject beyond-map-range points, then
    # collapse repeated stationary frames before entering whole-map BBS.
    query_min_range_m: 0.5
    query_max_range_m: 30.0
    query_voxel_leaf_m: 0.25
    min_points: 2000
    max_points: 250000

    # Backend JSON result gates. Expected stdout JSON fields:
    # success, x,y,z,qx,qy,qz,qw, score, fitness, overlap, optional message.
    # Tune these from replay distributions; false positives are more dangerous
    # than a clean FAILED relocalization result.
    min_score: 0.50
    max_fitness: 1.00
    min_overlap: 0.20

    # Score -> covariance mapping; field benchmark before freezing.
    best_position_std_m: 0.15
    worst_position_std_m: 0.80
    best_yaw_std_deg: 3.0
    worst_yaw_std_deg: 15.0
