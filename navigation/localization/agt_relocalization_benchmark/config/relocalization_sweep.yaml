# Conservative first-pass candidates for same-bag replay. Keep the grid small so
# a first field bag can be evaluated quickly; expand around the winner afterward.
acceptance:
  xy_error_m: 0.75
  z_error_m: 0.75
  yaw_error_deg: 12.0

candidates:
  baseline:
    scan_leaf: 0.25
    bbs_min_level_res: 0.25
    bbs_max_level: 6
    bbs_score_threshold: 0.30
    roll_pitch_range_deg: 12.0
    gicp_max_corr: 1.5
    local_map_radius_xy: 35.0
    local_map_half_height: 8.0
    min_local_map_points: 800
    threads: 4

  fast_coarse:
    scan_leaf: 0.35
    bbs_min_level_res: 0.35
    bbs_max_level: 5
    bbs_score_threshold: 0.30
    roll_pitch_range_deg: 8.0
    gicp_max_corr: 1.5
    local_map_radius_xy: 30.0
    local_map_half_height: 8.0
    min_local_map_points: 800
    threads: 4

  dense_scan:
    scan_leaf: 0.18
    bbs_min_level_res: 0.25
    bbs_max_level: 6
    bbs_score_threshold: 0.32
    roll_pitch_range_deg: 12.0
    gicp_max_corr: 1.2
    local_map_radius_xy: 35.0
    local_map_half_height: 8.0
    min_local_map_points: 800
    threads: 4

  strict_bbs:
    scan_leaf: 0.25
    bbs_min_level_res: 0.25
    bbs_max_level: 6
    bbs_score_threshold: 0.40
    roll_pitch_range_deg: 10.0
    gicp_max_corr: 1.2
    local_map_radius_xy: 35.0
    local_map_half_height: 8.0
    min_local_map_points: 800
    threads: 4

  wide_gicp:
    scan_leaf: 0.25
    bbs_min_level_res: 0.25
    bbs_max_level: 6
    bbs_score_threshold: 0.30
    roll_pitch_range_deg: 12.0
    gicp_max_corr: 2.0
    local_map_radius_xy: 45.0
    local_map_half_height: 10.0
    min_local_map_points: 800
    threads: 4
