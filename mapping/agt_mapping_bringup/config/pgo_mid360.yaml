# AGT V1 loop-closure / pose-graph baseline for robotics-laboratory/fast-lio2.
# The topics match the single fastlio2 node launched by mapping_mode.launch.py.

cloud_topic: /fastlio2/body_cloud
odom_topic: /fastlio2/lio_odom
map_frame: map
local_frame: lidar

key_pose_delta_deg: 10.0
key_pose_delta_trans: 0.5
loop_search_radius: 1.0
loop_time_tresh: 60.0
loop_score_tresh: 0.15
loop_submap_half_range: 5
submap_resolution: 0.10
min_loop_detect_duration: 5.0

# These are upstream starting values, not field-frozen thresholds. Tree-heavy
# outdoor maps must be checked for false loop closures before freezing them.
