# AGT Nav2 Humble baseline for Bunker v1 tracked chassis.
# External 3D localization owns map->odom; FAST-LIO2/localization adapter owns
# continuous local odometry. Bunker wheel odometry is monitoring/control aid only.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /agt/odometry/local
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 50.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.3
    odom_topic: /agt/odometry/local
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      # Final heading correction is valid progress too. SimpleProgressChecker
      # only watches XY displacement and can falsely abort while a tracked base
      # is rotating in place near the goal. PoseProgressChecker resets the same
      # watchdog on either translation or meaningful yaw progress.
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.20
      required_movement_angle: 0.10
      movement_time_allowance: 12.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.0872665
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.45
      lookahead_dist: 0.60
      min_lookahead_dist: 0.30
      max_lookahead_dist: 1.00
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.8
      transform_tolerance: 0.2
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.8
      regulated_linear_scaling_min_speed: 0.10
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.55
      rotate_to_heading_min_angle: 0.60
      # RPP uses odometry twist to bootstrap rotate-to-heading. Batch-LIO pose
      # updates are lower-rate than this 50 Hz controller, so keeping the same
      # 0.8 rad/s^2 limit here as the downstream smoother/guard can repeatedly
      # clamp a stationary start to one 50 Hz acceleration step (~0.016 rad/s).
      # Leave the physical 0.8 rad/s^2 limit to velocity_smoother/cmd_vel_guard;
      # this controller-side value only prevents the algorithmic bootstrap lock.
      # 10.0 was validated in Gazebo with the 10 Hz pose-derived LIO twist: it
      # gives RPP enough first-step authority to enter an observable rotation,
      # while the downstream 0.8 rad/s^2 limits still bound chassis acceleration.
      max_angular_accel: 10.0
      allow_reversing: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # Nav2 Humble declares width/height as integer-valued meters.
      width: 8
      height: 8
      resolution: 0.05
      footprint: "[[0.52,0.40],[0.52,-0.40],[-0.52,-0.40],[-0.52,0.40]]"
      footprint_padding: 0.03
      transform_tolerance: 0.20
      plugins: [voxel_layer, inflation_layer]
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: false
        origin_z: -0.3
        # Humble voxel_grid supports at most 16 z cells. Keep the previous
        # 2.4 m vertical span with 16 * 0.15 m instead of the invalid 24 * 0.10 m.
        z_resolution: 0.15
        z_voxels: 16
        max_obstacle_height: 2.1
        mark_threshold: 0
        observation_sources: lidar3d
        lidar3d:
          topic: /agt/navigation/points_obstacles
          data_type: PointCloud2
          marking: true
          clearing: true
          obstacle_min_range: 0.30
          obstacle_max_range: 12.0
          raytrace_min_range: 0.30
          raytrace_max_range: 15.0
          min_obstacle_height: 0.10
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.52,0.40],[0.52,-0.40],[-0.52,-0.40],[-0.52,0.40]]"
      footprint_padding: 0.03
      transform_tolerance: 0.20
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.55
    min_rotational_vel: 0.10
    rotational_acc_lim: 0.8

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 50.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.55, 0.0, 0.65]
    min_velocity: [-0.20, 0.0, -0.65]
    max_accel: [0.45, 0.0, 0.80]
    max_decel: [-0.55, 0.0, -0.90]
    odom_topic: /agt/odometry/local
    odom_duration: 0.1
    deadband_velocity: [0.01, 0.0, 0.01]
    velocity_timeout: 0.25

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""
