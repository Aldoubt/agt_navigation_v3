agt_rtk_manager:
  ros__parameters:
    fix_topic: /ins/navsatfix
    status_topic: /ins/status
    output_topic: /agt/rtk/status
    publish_rate_hz: 5.0
    max_fix_age_sec: 1.0
    max_status_age_sec: 1.0
    min_satellites: 8
    fixed_max_position_std_m: 0.15
    float_max_position_std_m: 0.60
    max_heading_std_deg: 8.0
    allow_float_for_auxiliary: true
    map_origin_file: ""
