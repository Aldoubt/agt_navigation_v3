agt_global_relocalization:
  ros__parameters:
    scan_topic: /agt/livox/points
    request_topic: /agt/relocalization/request
    output_pose_topic: /agt/relocalization/pose
    status_topic: /agt/global_relocalization/status
    map_frame: map

    # Follow the validated active Map Package by default. global_map and
    # relocalization_assets below remain manual fallback paths for bench tests.
    follow_map_manager: true
    map_status_topic: /agt/map/status

    # Convert raw MID360 PointCloud2 into base_link using the measured/static URDF TF
    # before BBS. This removes the intentional LiDAR mounting tilt. V1 requires the
    # robot to be stationary while the cached scans are collected; multi-frame odom
    # deskew can be added later if moving relocalization is required.
    query_frame: base_link
    tf_timeout_sec: 0.10
    require_stationary: true
    local_odom_topic: /agt/odometry/local
    odom_freshness_sec: 0.50
    stationary_linear_threshold_mps: 0.05
    stationary_angular_threshold_rps: 0.08

    # V1 backend: no-initial-pose CPU 3D-BBS coarse search followed by small_gicp.
    # The backend parameters are deliberately exposed here so rosbag replay sweeps
    # can tune them without patching C++ defaults.
    sdk_command: >-
      ros2 run agt_global_relocalization_native bbs_gicp_localizer
      --map {global_map} --scan {scan_pcd} {assets_arg}
      --timeout {timeout_sec}
      --scan-leaf {scan_leaf}
      --bbs-min-level-res {bbs_min_level_res}
      --bbs-max-level {bbs_max_level}
      --bbs-score-threshold {bbs_score_threshold}
      --roll-pitch-range-deg {roll_pitch_range_deg}
      --gicp-max-corr {gicp_max_corr}
      --local-map-radius-xy {local_map_radius_xy}
      --local-map-half-height {local_map_half_height}
      --min-local-map-points {min_local_map_points}
      --threads {backend_threads}
    global_map: ""
    relocalization_assets: ""
    backend_scan_leaf: 0.25
    backend_bbs_min_level_res: 0.25
    backend_bbs_max_level: 6
    backend_bbs_score_threshold: 0.30
    backend_roll_pitch_range_deg: 12.0
    backend_gicp_max_corr: 1.5
    backend_local_map_radius_xy: 35.0
    backend_local_map_half_height: 8.0
    backend_min_local_map_points: 800
    backend_threads: 4
    work_dir: ~/.ros/agt_global_relocalization
    sdk_timeout_sec: 10.0

    # Accumulate several navigation-only PointCloud2 frames. Batch-LIO continues
    # to consume the untouched timing-preserving Livox CustomMsg stream.
    accumulate_clouds: 5
    min_points: 2000
    max_points: 250000

    # Backend JSON result gates. Tune these from replay distributions; never lower
    # them merely to make every query return a pose because false positives are worse
    # than a clean FAILED result for Nav2.
    min_score: 0.50
    max_fitness: 1.00
    min_overlap: 0.20

    # Score -> covariance mapping; field benchmark before freezing.
    best_position_std_m: 0.15
    worst_position_std_m: 0.80
    best_yaw_std_deg: 3.0
    worst_yaw_std_deg: 15.0
