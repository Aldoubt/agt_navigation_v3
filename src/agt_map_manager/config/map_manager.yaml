agt_map_manager:
  ros__parameters:
    # All immutable map packages and their active-map pointer live inside the
    # shared ROS workspace, so mapping, HMI editing and navigation consume one
    # visible storage root.
    map_root: /home/yangxuan/ros2_ws/agt_data/maps
    active_state_file: /home/yangxuan/ros2_ws/agt_data/maps/active_map.yaml

    # Discovery should stay responsive even for very large PCD files.
    # Full declared hashes are checked at the load boundary.
    verify_hashes_on_discovery: false
    verify_hashes_on_load: true

    status_topic: /agt/map/status
    list_service: /agt/map/list
    load_service: /agt/map/load
