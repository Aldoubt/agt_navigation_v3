agt_bunker_command_guard:
  ros__parameters:
    input_topic: /cmd_vel_smoothed
    output_topic: /mux/cmd_vel
    output_rate_hz: 50.0
    command_timeout_sec: 0.25

    # Conservative demo defaults for Bunker tracked chassis.
    # Tune from rosbag/field tests; do not treat these as final acceptance limits.
    max_linear_x: 0.60
    max_angular_z: 0.80
    max_linear_accel: 0.60
    max_linear_decel: 1.20
    max_angular_accel: 1.20

    publish_rate_topic: /agt/control/cmd_output_rate_hz
