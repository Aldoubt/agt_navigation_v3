agt_obstacle_cloud_preprocessor:
  ros__parameters:
    # Navigation/local-perception branch only. FAST-LIO2 must keep its original
    # time-preserving MID360 input path (usually Livox CustomMsg).
    # agt_livox_tools normalizes either driver representation to PointCloud2 here.
    input_topic: /agt/livox/points
    output_topic: /agt/navigation/points_obstacles
    base_frame: base_link

    # Empty accepts the actual source frame and relies on TF base_link <- cloud_frame.
    expected_input_frame: ""
    tf_timeout_sec: 0.05
    drop_on_tf_failure: true

    range:
      min_m: 0.5
      max_m: 120.0

    self_filter:
      enabled: true
      center_xyz: [0.0, 0.0, 0.20]
      size_xyz: [1.023, 0.778, 0.400]
      padding_m: 0.05

    # Rear filtering is navigation-only. Do not enable for mapping or localization
    # pipelines because removing environmental features can reduce map quality.
    rear_filter:
      enabled: false
      type: box
      box:
        x_min: -2.0
        x_max: 0.0
        y_min: -0.8
        y_max: 0.8
        z_min: -0.5
        z_max: 2.0

    # Legacy angular rear mask kept for compatibility with previous experiments.
    rear_sector:
      enabled: false
      center_deg: 180.0
      width_deg: 10.0
      min_range_m: 0.5
      max_range_m: 4.0

    voxel:
      enabled: true
      leaf_size_m: 0.20
