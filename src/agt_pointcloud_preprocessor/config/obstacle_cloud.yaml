agt_obstacle_cloud_preprocessor:
  ros__parameters:
    # This branch is for Nav2/global-localization preprocessing only.
    # Do not remap FAST-LIO2's time-preserving input through this node.
    input_topic: /livox/lidar
    output_topic: /agt/navigation/points_obstacles
    base_frame: base_link
    expected_input_frame: lidar_link
    tf_timeout_sec: 0.05
    drop_on_tf_failure: true

    range:
      min_m: 0.5
      max_m: 120.0

    self_filter:
      enabled: true
      center_xyz: [0.0, 0.0, 0.20]
      size_xyz: [1.023, 0.778, 0.400]
      padding_m: 0.05

    # Keep disabled until the MID360 rosbag proves that a narrow rear-pole mask
    # is needed and its actual geometry has been measured.
    rear_sector:
      enabled: false
      center_deg: 180.0
      width_deg: 10.0
      min_range_m: 0.5
      max_range_m: 4.0

    voxel:
      enabled: true
      leaf_size_m: 0.20
