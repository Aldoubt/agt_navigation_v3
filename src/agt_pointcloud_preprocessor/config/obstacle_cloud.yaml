agt_obstacle_cloud_preprocessor:
  ros__parameters:
    # Navigation/local-perception branch only. FAST-LIO2 must keep its original
    # time-preserving MID360 input path (usually Livox CustomMsg).
    # agt_livox_tools normalizes either driver representation to PointCloud2 here.
    # Live secondary PointCloud2 branch from agt_livox_tools. Recorded-bag
    # commissioning topics must be overridden explicitly by replay launches.
    input_topic: /agt/livox/points
    output_topic: /agt/navigation/points_obstacles
    base_frame: base_link

    # Empty accepts the actual source frame and relies on TF base_link <- cloud_frame.
    # Set this explicitly to lidar_link/livox_frame after the target URDF+driver frame is frozen.
    expected_input_frame: ""
    tf_timeout_sec: 0.05
    drop_on_tf_failure: true

    range:
      min_m: 0.5
      max_m: 120.0

    self_filter:
      enabled: true
      center_xyz: [0.0, 0.0, 0.20]
      size_xyz: [1.023, 0.778, 0.400]
      padding_m: 0.05

    # Keep disabled until the MID360 rosbag proves that a narrow rear-pole mask
    # is needed and its actual geometry has been measured.
    rear_sector:
      enabled: false
      center_deg: 180.0
      width_deg: 10.0
      min_range_m: 0.5
      max_range_m: 4.0

    voxel:
      enabled: true
      leaf_size_m: 0.20
