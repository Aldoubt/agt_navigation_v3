agt_cmd_vel_guard:
  ros__parameters:
    # Nav2 owns motion by default. Qt HMI publishes manual commands to a
    # separate topic and must explicitly request manual mode before they pass.
    input_topic: /cmd_vel
    manual_input_topic: /agt/hmi/cmd_vel
    control_mode_topic: /agt/control/mode
    default_control_mode: navigation
    output_topic: /mux/cmd_vel
    publish_rate_hz: 50.0
    command_timeout_sec: 0.25

    # Fail closed: no fresh, valid LocalizationStatus means no chassis motion.
    # DEGRADED remains blocked in V1; enable only after a deliberate field policy.
    localization_status_topic: /agt/localization/status
    require_localization_status: true
    localization_status_timeout_sec: 0.75
    allow_degraded_localization: false

    # Conservative Bunker v1 demo limits. Freeze only after field benchmarks.
    max_linear_x: 0.55
    max_reverse_x: 0.20
    max_angular_z: 0.65
    max_linear_accel: 0.45
    max_linear_decel: 0.80
    max_angular_accel: 0.80
