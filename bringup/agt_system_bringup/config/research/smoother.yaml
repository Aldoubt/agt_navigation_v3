agt_epoch_velocity_smoother:
  ros__parameters:
    research_enabled: false
    field_verified: false
    owner_id: agt_task_continuity
    input_topic: /agt/research/cmd_vel_source
    output_topic: /agt/research/cmd_vel_smoothed
    mode_topic: /agt/research/navigation_mode
    smoothing_frequency: 50.0
    source_timeout_sec: 0.25
    mode_timeout_sec: 0.25
    max_linear_accel: 0.0
    max_linear_decel: 0.0
    max_angular_accel: 0.0
