name: humble-smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-and-manifest-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install syntax-check dependencies
        run: python3 -m pip install --user pyyaml
      - name: Python syntax
        run: python3 -m compileall -q src
      - name: Shell syntax and repository manifest
        run: |
          bash -n scripts/bootstrap_humble.sh
          bash -n scripts/bootstrap_terrain_mapping.sh
          bash -n scripts/field_build_smoke.sh
          python3 - <<'PY'
          import pathlib
          import yaml
          for manifest_name in ('dependencies/field_demo.repos', 'dependencies/terrain_native.repos'):
              path = pathlib.Path(manifest_name)
              data = yaml.safe_load(path.read_text(encoding='utf-8'))
              repos = data.get('repositories') if isinstance(data, dict) else None
              assert isinstance(repos, dict) and repos
              for relpath, spec in repos.items():
                  parts = pathlib.PurePosixPath(relpath).parts
                  assert relpath and not relpath.startswith('/') and '..' not in parts
                  assert isinstance(spec, dict)
                  assert spec.get('type') == 'git'
                  assert isinstance(spec.get('url'), str) and spec['url']
                  assert isinstance(spec.get('version'), str) and spec['version']
              print(f'{manifest_name} PASS: {len(repos)} repositories')
          PY
      - name: Parse package manifests and YAML
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          import yaml
          for path in pathlib.Path('src').rglob('package.xml'):
              ET.parse(path)
          for path in pathlib.Path('src').rglob('*.yaml'):
              with path.open('r', encoding='utf-8') as f:
                  yaml.safe_load(f)
          print('manifest/yaml smoke PASS')
          PY

  ros2-humble-core-build:
    runs-on: ubuntu-22.04
    container: osrf/ros:humble-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            python3-colcon-common-extensions \
            python3-pip \
            ros-humble-navigation2 \
            ros-humble-nav2-bringup \
            ros-humble-pcl-conversions
      - name: Build hardware-independent AGT core
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --event-handlers console_direct+ \
            --packages-select \
              agt_robot_interfaces \
              agt_pointcloud_preprocessor \
              agt_map_converter \
              agt_terrain_map_generator \
              agt_map_manager \
              agt_localization_manager \
              agt_batch_lio_adapter \
              agt_base_control \
              agt_nav2_bringup
      - name: Run core tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+ \
            --packages-select agt_map_converter agt_map_manager
          colcon test-result --verbose

  terrain-patchworkpp-adapter-build:
    runs-on: ubuntu-22.04
    container: osrf/ros:humble-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Install terrain native build dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cmake \
            git \
            libeigen3-dev \
            libpcl-dev \
            python3-colcon-common-extensions \
            ros-humble-pcl-conversions
      - name: Build and install pinned Patchwork++
        shell: bash
        run: |
          git clone https://github.com/url-kaist/patchwork-plusplus.git /tmp/patchwork-plusplus
          git -C /tmp/patchwork-plusplus checkout 3e6903a1d5537a4cc2ace897b0bbb98a92d6014c
          cmake -S /tmp/patchwork-plusplus/cpp -B /tmp/patchwork-plusplus/build-agt \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/agt-native \
            -DUSE_SYSTEM_EIGEN3=ON \
            -DINCLUDE_CPP_EXAMPLES=OFF
          cmake --build /tmp/patchwork-plusplus/build-agt -j2
          cmake --install /tmp/patchwork-plusplus/build-agt
          find /opt/agt-native -type f \
            \( -name 'patchworkppConfig.cmake' -o -name 'patchworkpp-config.cmake' \) \
            -print -quit | grep -q .
      - name: Build AGT terrain generator with Patchwork++ adapter
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          export CMAKE_PREFIX_PATH="/opt/agt-native:${CMAKE_PREFIX_PATH:-}"
          colcon build --symlink-install --event-handlers console_direct+ \
            --packages-select agt_terrain_map_generator \
            --cmake-args -DAGT_ENABLE_PATCHWORKPP=ON
          test -f install/agt_terrain_map_generator/lib/libagt_patchworkpp_ground_segmenter.so

  inspection-runtime-build:
    runs-on: ubuntu-22.04
    container: osrf/ros:humble-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git \
            python3-colcon-common-extensions \
            ros-humble-navigation2 \
            ros-humble-nav2-bringup
      - name: Fetch pinned C1 public interfaces
        shell: bash
        run: |
          git clone https://github.com/Aldoubt/Autolabor-C1-ROS2.git src/external_c1
          git -C src/external_c1 checkout 10d82179dc34ae035b382e9b465e4b8f5d55c0a8
      - name: Build inspection runtime and RViz mission layer
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --event-handlers console_direct+ \
            --packages-select \
              camera_gimbal_interfaces \
              agt_robot_interfaces \
              agt_navigation_runtime \
              agt_rviz_patrol
      - name: Import runtime against generated action interfaces
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          python3 - <<'PY'
          from action_msgs.msg import GoalStatus
          from camera_gimbal_interfaces.action import AcquireView
          from agt_navigation_runtime.mission_runtime import MissionRuntime
          assert GoalStatus.STATUS_SUCCEEDED == 4
          assert AcquireView is not None
          assert MissionRuntime is not None
          print('inspection runtime import PASS')
          PY

  native-relocalization-build:
    runs-on: ubuntu-22.04
    container: osrf/ros:humble-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cmake \
            git \
            libboost-filesystem-dev \
            libboost-system-dev \
            libeigen3-dev \
            libpcl-dev \
            python3-colcon-common-extensions
      - name: Build and install pinned 3D-BBS CPU library
        shell: bash
        run: |
          git clone https://github.com/KOKIAOKI/3d_bbs.git /tmp/3d_bbs
          git -C /tmp/3d_bbs checkout 41529a34a2fb9618b5ff560fb3c2363f1615666d
          cmake -S /tmp/3d_bbs -B /tmp/3d_bbs/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_CUDA=OFF
          cmake --build /tmp/3d_bbs/build -j2
          cmake --install /tmp/3d_bbs/build
          ldconfig
      - name: Build and install pinned small_gicp
        shell: bash
        run: |
          git clone https://github.com/koide3/small_gicp.git /tmp/small_gicp
          git -C /tmp/small_gicp checkout 2c6c7831bc1f5ada2ee5300027fe7d7aee66827d
          cmake -S /tmp/small_gicp -B /tmp/small_gicp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_HELPER=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_BENCHMARKS=OFF
          cmake --build /tmp/small_gicp/build -j2
          cmake --install /tmp/small_gicp/build
          ldconfig
      - name: Build AGT native relocalization backend
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --event-handlers console_direct+ \
            --packages-select agt_global_relocalization_native

# This workflow intentionally does not claim a full field-demo build. The full
# chain additionally needs Livox/Batch-LIO/Fast-LIO2 and INS hardware-interface
# dependencies. Use scripts/bootstrap_humble.sh + scripts/field_build_smoke.sh
# on the target Humble workspace.
