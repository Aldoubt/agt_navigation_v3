name: field-console-Qt5-offline
on:
  push:
    paths:
      - "bringup/agt_operator_console/agt_operator_console/field_console*.py"
      - "bringup/agt_operator_console/test/test_field_console*.py"
      - "bringup/agt_operator_console/package.xml"
      - "bringup/agt_operator_console/setup.py"
      - ".github/workflows/field_console_qt.yml"
  pull_request:
    paths:
      - "bringup/agt_operator_console/agt_operator_console/field_console*.py"
      - "bringup/agt_operator_console/test/test_field_console*.py"
      - ".github/workflows/field_console_qt.yml"
jobs:
  desktop-ui-offline:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu Qt5 + YAML
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pyqt5 python3-yaml
      - name: Verify runtime imports (do not silently skip Qt)
        run: /usr/bin/python3 -c "import PyQt5.QtWidgets, yaml"
      - name: Check Qt and model Python syntax
        run: |
          /usr/bin/python3 -m py_compile \
            bringup/agt_operator_console/agt_operator_console/field_console_core.py \
            bringup/agt_operator_console/agt_operator_console/field_console_bridge.py \
            bringup/agt_operator_console/agt_operator_console/field_console.py
      - name: Unit and offscreen GUI interaction tests (NO ROS / NO CAN)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          /usr/bin/python3 -m unittest discover \
            -s bringup/agt_operator_console/test -p "test_field_console*.py" -v
