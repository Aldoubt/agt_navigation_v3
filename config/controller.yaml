# Controller algorithm only. Numeric speed/acceleration limits are injected
# from safety.yaml so there is one motion-limit authority.
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 50.0
    failure_tolerance: 0.3
    odom_topic: /agt/odometry/local
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.05
      required_movement_angle: 0.05
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.0872665
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      # The tracked chassis needs enough preview to absorb its measured yaw
      # response lag instead of repeatedly crossing and reacquiring the path.
      lookahead_dist: 0.80
      min_lookahead_dist: 0.65
      max_lookahead_dist: 1.30
      lookahead_time: 2.0
      use_velocity_scaled_lookahead_dist: true
      use_interpolation: true
      approach_velocity_scaling_dist: 0.8
      transform_tolerance: 0.2
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      # Start reducing forward speed on broader turns. At the 0.40 m/s field
      # cruise this also keeps ordinary path-following yaw near 0.33 rad/s.
      regulated_linear_scaling_min_radius: 1.2
      use_cost_regulated_linear_velocity_scaling: true
      # Must remain within the local inflation radius and use the same decay
      # factor so RPP slows consistently as obstacle cost rises.
      cost_scaling_dist: 0.80
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 2.0
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.60
      allow_reversing: false
