# Costmap geometry/window policy only. Footprint comes from robot.yaml and the
# complete obstacle observation source comes from perception.yaml.
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      transform_tolerance: 0.20
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Keep a useful soft-cost band outside the 0.43 m padded half-width.
        # The previous 0.55 m radius left only about 0.12 m of wall clearance.
        inflation_radius: 0.85
        cost_scaling_factor: 2.0
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 0.20
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Bias the global route toward the middle of field lanes while still
        # allowing the 0.8 m-wide chassis through a roughly 2 m passage.
        inflation_radius: 1.00
        cost_scaling_factor: 2.0
      always_send_full_costmap: true
