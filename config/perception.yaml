# Sole obstacle-cloud authority: preprocessing and the consuming costmap source
# are kept together. This stream is never inserted before the LIO front-end.
agt_pointcloud_preprocessor:
  ros__parameters:
    input_topic: /agt/livox/points
    output_topic: /agt/navigation/points_obstacles
    base_frame: base_link
    expected_input_frame: ""
    tf_timeout_sec: 0.05
    drop_on_tf_failure: true
    range:
      min_m: 0.5
      max_m: 120.0
    self_filter:
      enabled: true
      center_xyz: [0.0, 0.0, 0.20]
      size_xyz: [1.023, 0.778, 0.400]
      padding_m: 0.05
    rear_filter:
      # Keep the normal navigation profile visible behind the robot. The field
      # launcher can enable a short-range trial mask explicitly when auditing
      # reflections from the rear-mounted pole.
      enabled: false
      center_deg: 180.0
      width_deg: 70.0
      min_range_m: 0.5
      max_range_m: 1.0
    ground_filter:
      enabled: true
      # Radial slope tracking follows rolling terrain while retaining steps,
      # trunks and slopes above the configured traversability limit.
      mode: radial_slope
      sensor_ground_z_m: -0.20
      radial_bin_deg: 1.5
      local_max_slope_deg: 35.0
      global_max_slope_deg: 35.0
      min_height_threshold_m: 0.08
      max_ground_gap_m: 0.75
      max_ground_range_m: 15.0
      min_obstacle_height_m: 0.10
      max_obstacle_height_m: 2.00
    voxel:
      enabled: true
      leaf_size_m: 0.10
    statistics_output: ""
    debug_log_interval_sec: 0.0
    debug_base_cloud:
      enabled: false
      topic: /agt/debug/points_obstacles_base

local_costmap:
  local_costmap:
    ros__parameters:
      plugins: [voxel_layer, inflation_layer]
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: false
        origin_z: -0.3
        z_resolution: 0.15
        z_voxels: 16
        max_obstacle_height: 2.1
        mark_threshold: 0
        # The ground-filtered cloud is authoritative for marking.  Clearing
        # also needs ground/background rays; otherwise a person can leave no
        # return behind and their old voxel remains occupied.
        observation_sources: lidar3d_mark lidar3d_clear
        lidar3d_mark:
          topic: /agt/navigation/points_obstacles
          data_type: PointCloud2
          marking: true
          clearing: false
          observation_persistence: 0.0
          obstacle_min_range: 0.30
          obstacle_max_range: 12.0
          min_obstacle_height: 0.10
          max_obstacle_height: 2.0
        lidar3d_clear:
          topic: /agt/livox/points
          data_type: PointCloud2
          marking: false
          clearing: true
          observation_persistence: 0.0
          raytrace_min_range: 0.30
          raytrace_max_range: 15.0
          # Retain ground endpoints for clearing rays; this source never marks.
          min_obstacle_height: -1.50
          max_obstacle_height: 2.50
